[project]
name = "utcoursesplus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Keshav Singh", email = "keshavussingh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "selectolax>=1.0.0",
]

[project.scripts]
utcoursesplus = "utcoursesplus.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
